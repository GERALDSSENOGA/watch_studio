# WatchStudio — Base44 sandbox development stack
#
# Runs the app FROM THE CLONED SOURCE with live reload:
#   web   — next dev (port 3000, the public preview entry point)
#   ws    — standalone WebSocket server (port 3001, rooms/chat/playback sync)
#   db    — PostgreSQL 17
#   install / migrate — one-shot setup services (npm ci + prisma generate,
#                       then prisma migrate deploy)
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Notes:
#   - node_modules lives in a named volume shared by web/ws so dependencies are
#     installed once, from the lockfile, by the `install` service.
#   - Non-secret runtime configuration is inline below; placeholders live in
#     .env.base44-defaults and platform-managed values in /run/base44/app.env
#     (listed LAST so a real value always wins).

name: watchstudio

x-app-env: &app-env
  - DATABASE_URL=postgresql://watchstudio:watchstudio@db:5432/watchstudio
  - NEXTAUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
  - AUTH_TRUST_HOST=true
  - WS_PORT=3001
  - WS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
  - NEXT_PUBLIC_WS_URL=wss://3001-${BASE44_PUBLIC_HOST_SUFFIX}
  - BASE44_PUBLIC_HOST_SUFFIX
  - BASE44_PREVIEW_MODE
  - NEXT_TELEMETRY_DISABLED=1

x-app: &app
  working_dir: /app
  volumes:
    - .:/app
    - watchstudio_node_modules:/app/node_modules

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: watchstudio
      POSTGRES_PASSWORD: watchstudio
      POSTGRES_DB: watchstudio
    volumes:
      - watchstudio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchstudio -d watchstudio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  install:
    <<: *app
    image: node:22
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && npx prisma generate
    env_file: &default-env-files
      - path: ./.env.base44-defaults
        required: false
      - path: /run/base44/app.env
        required: false
    environment: *app-env
    restart: "no"

  migrate:
    <<: *app
    image: node:22
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    command: ["sh", "-ec", "exec npx prisma migrate deploy"]
    env_file: *default-env-files
    environment: *app-env
    restart: "no"

  web:
    <<: *app
    image: node:22
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - exec npx next dev --hostname 0.0.0.0 --port 3000
    env_file: *default-env-files
    environment: *app-env
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 5 -O /dev/null http://127.0.0.1:3000/login || exit 1
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: WatchStudio
      base44.kind: web
      base44.port: "3000"

  ws:
    <<: *app
    image: node:22
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["node", "server/ws.mts"]
    env_file: *default-env-files
    environment: *app-env
    ports:
      - "3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const W=require('ws');const s=new W('ws://127.0.0.1:3001/');
          const done=(c)=>{try{s.terminate()}catch(e){};process.exit(c)};
          s.on('open',()=>done(0));s.on('error',()=>done(1));
          setTimeout(()=>done(1),5000)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    labels:
      base44.project: WatchStudio Realtime
      base44.kind: worker
      base44.port: "3001"

volumes:
  watchstudio_pgdata:
  watchstudio_node_modules:
