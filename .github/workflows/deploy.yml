# WatchStudio CI/CD
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   REGISTRY_USERNAME   — registry username (e.g. your GHCR org/user)
#   REGISTRY_PASSWORD   — registry personal access token (write:packages)
#   DEPLOY_HOST         — VPS hostname or IP
#   DEPLOY_USER         — SSH user on the VPS (e.g. root or deploy)
#   DEPLOY_SSH_KEY      — private SSH key matching an authorized key on the VPS
#   DEPLOY_DIR          — absolute path where the repo lives on the VPS
#   DEPLOY_ENV_FILE     — path to .env.production on the VPS (e.g. /home/deploy/watchstudio/.env.production)
#
# Required on the VPS:
#   - Docker + Docker Compose installed
#   - `docker compose -f docker-compose.prod.yml up -d` runnable by DEPLOY_USER
#   - .env.production present at DEPLOY_ENV_FILE
#   - The watchstudio image pullable (GHCR) or built locally on the VPS

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
